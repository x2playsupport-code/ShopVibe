<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVibe Ultra Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #06070a;
      --card-bg: rgba(18, 20, 32, 0.85);
      --accent-purple: #9d4edd;
      --accent-pink: #ff007f;
      --accent-orange: #ff5500;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 6%; background: rgba(10, 11, 18, 0.9);
      backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-logo { font-family: 'Poppins', sans-serif; font-size: 32px; font-weight: 900; color: #fff; text-decoration: none; }
    .brand-logo span { background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .search-box { flex: 0 1 450px; position: relative; }
    .search-box input {
      width: 100%; padding: 12px 20px; border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.05);
      color: #fff; font-size: 14px; outline: none;
    }

    .cart-trigger {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
      padding: 12px 24px; border-radius: 30px; border: none; color: #fff;
      font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }

    .container { padding: 30px 6%; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }

    .product-card {
      background: var(--card-bg); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden; transition: transform 0.3s ease; display: flex; flex-direction: column;
    }
    .product-card:hover { transform: translateY(-8px); border-color: var(--accent-pink); }

    .product-img { width: 100%; height: 220px; object-fit: cover; cursor: pointer; }
    .product-info { padding: 18px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }

    .price-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
    .price { font-size: 24px; font-weight: 900; color: var(--accent-orange); }

    .add-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
      color: #fff; font-weight: 800; cursor: pointer;
    }

    /* Cart Sidebar */
    .cart-drawer {
      position: fixed; top: 0; left: -400px; width: 380px; height: 100vh;
      background: #0d0e17; border-right: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 1000; padding: 25px; display: flex; flex-direction: column;
      justify-content: space-between; transition: left 0.4s ease;
    }
    .cart-drawer.open { left: 0; }

    .cart-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; margin-bottom: 10px; }
    .cart-item img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }

    /* AI Widget */
    .ai-widget-btn {
      position: fixed; bottom: 25px; right: 25px;
      background: linear-gradient(135deg, #8a2be2, #ff007f);
      width: 60px; height: 60px; border-radius: 50%; display: flex;
      justify-content: center; align-items: center; font-size: 28px;
      cursor: pointer; box-shadow: 0 8px 25px rgba(255, 0, 127, 0.5); z-index: 999;
    }

    .ai-chat-box {
      position: fixed; bottom: 95px; right: 25px; width: 320px; height: 400px;
      background: #0d0e17; border: 1px solid rgba(255, 0, 127, 0.3);
      border-radius: 20px; display: none; flex-direction: column; z-index: 999; overflow: hidden;
    }
    .ai-chat-box.active { display: flex; }

    .ai-header { background: linear-gradient(135deg, #8a2be2, #ff007f); padding: 12px 15px; font-weight: 800; display: flex; justify-content: space-between; }
    .ai-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
    .msg-ai { background: rgba(255, 255, 255, 0.08); padding: 8px 12px; border-radius: 10px; align-self: flex-start; }
    .ai-input-area { padding: 10px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; gap: 5px; }
    .ai-input-area input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 15px; color: #fff; outline: none; }

    /* Mobile Nav */
    @media (max-width: 768px) {
      .search-box { display: none; }
      .mobile-nav {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
        background: rgba(10, 11, 18, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex; justify-content: space-around; align-items: center; z-index: 998;
      }
      .mobile-nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; cursor: pointer; }
      .mobile-nav-item span { font-size: 18px; }
    }
    @media (min-width: 769px) { .mobile-nav { display: none; } }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-logo">Shop<span>Vibe</span></a>
    <div class="search-box">
      <input type="text" placeholder="חפש מוצרים, מותגים וגאדג'טים...">
    </div>
    <button class="cart-trigger" onclick="toggleCart()">🛒 עגלה (<span id="cartCount">0</span>)</button>
  </header>

  <div class="container">
    <h2 style="margin-bottom: 25px;">🔥 מוצרים מובילים</h2>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- Cart Sidebar -->
  <div class="cart-drawer" id="cartDrawer">
    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
        <h2>🛒 עגלת קניות</h2>
        <button onclick="toggleCart()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <div id="cartItemsList"></div>
    </div>
    <div>
      <div style="display:flex; justify-content:space-between; margin-bottom: 15px; font-size: 18px; font-weight:800;">
        <span>סה"כ:</span>
        <span id="totalPrice">₪0</span>
      </div>
      <button class="add-btn" onclick="goToCheckout()">🔒 המשך לתשלום בטוח</button>
    </div>
  </div>

  <!-- AI Chat Widget -->
  <div class="ai-widget-btn" onclick="toggleAIChat()">🤖</div>
  <div class="ai-chat-box" id="aiChatBox">
    <div class="ai-header">
      <span>🤖 VibeAI Assistant</span>
      <span style="cursor:pointer;" onclick="toggleAIChat()">✕</span>
    </div>
    <div class="ai-messages" id="aiMessages">
      <div class="msg-ai">היי! איזה גאדג'ט את/ה מחפש/ת היום? 🚀</div>
    </div>
    <div class="ai-input-area">
      <input type="text" id="aiInput" placeholder="רשום לי הודעה..." onkeypress="handleAIPress(event)">
    </div>
  </div>

  <!-- Mobile Nav Bar -->
  <div class="mobile-nav">
    <div class="mobile-nav-item"><span>🏠</span>בית</div>
    <div class="mobile-nav-item"><span>🔍</span>חיפוש</div>
    <div class="mobile-nav-item" onclick="toggleCart()"><span>🛒</span>עגלה</div>
    <div class="mobile-nav-item" onclick="toggleAIChat()"><span>🤖</span>AI</div>
  </div>

  <script>
    const products = [
      { id: 1, name: "אוזניות Premium 3D", price: 299, img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" },
      { id: 2, name: "שעון ספורט AMOLED", price: 199, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
      { id: 3, name: "מצלמת אקסטרים 4K", price: 450, img: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500" },
      { id: 4, name: "משקפי VR עתידניים", price: 890, img: "https://images.unsplash.com/photo-1622979135225-d2ba269bc1bd?w=500" }
    ];

    let cart = JSON.parse(localStorage.getItem('shopvibe_cart')) || [];

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.img}" class="product-img" alt="${p.name}" onclick="viewProduct(${p.id})">
          <div class="product-info">
            <h3 onclick="viewProduct(${p.id})" style="cursor:pointer">${p.name}</h3>
            <div class="price-row">
              <span class="price">₪${p.price}</span>
            </div>
            <button class="add-btn" onclick="addToCart(${p.id})">הוסף לעגלה</button>
          </div>
        </div>
      `).join('');
      updateCartUI();
    }

    function viewProduct(id) {
      window.location.href = `product.html?id=${id}`;
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      cart.push(item);
      saveCart();
      updateCartUI();
      toggleCart();
    }

    function updateCartUI() {
      document.getElementById('cartCount').innerText = cart.length;
      const list = document.getElementById('cartItemsList');
      list.innerHTML = cart.map((item, i) => `
        <div class="cart-item">
          <img src="${item.img}">
          <div style="flex:1;">
            <div style="font-size:14px; font-weight:700;">${item.name}</div>
            <div style="color:var(--accent-orange);">₪${item.price}</div>
          </div>
          <button onclick="removeItem(${i})" style="background:none; border:none; color:red; cursor:pointer;">✕</button>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('totalPrice').innerText = '₪' + total;
    }

    function removeItem(index) {
      cart.splice(index, 1);
      saveCart();
      updateCartUI();
    }

    function saveCart() {
      localStorage.setItem('shopvibe_cart', JSON.stringify(cart));
    }

    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
    }

    function toggleAIChat() {
      document.getElementById('aiChatBox').classList.toggle('active');
    }

    function handleAIPress(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('aiInput');
        const msgList = document.getElementById('aiMessages');
        if (!input.value.trim()) return;

        msgList.innerHTML += `<div style="background: linear-gradient(135deg, #ff007f, #ff6b00); padding: 8px 12px; border-radius: 10px; color: #fff; align-self: flex-end;">${input.value}</div>`;
        input.value = '';

        setTimeout(() => {
          msgList.innerHTML += `<div class="msg-ai">ממליץ בחום על **משקפי ה-VR** או **האוזניות**! להוסיף אותם עבורך לעגלה? 🎧</div>`;
          msgList.scrollTop = msgList.scrollHeight;
        }, 600);
      }
    }

    function goToCheckout() {
      if(cart.length === 0) return alert('העגלה ריקה!');
      window.location.href = 'checkout.html';
    }

    renderProducts();
  </script>
</body>
</html>
